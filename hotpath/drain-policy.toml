# Policy for the `drain` benchmark. Lockstep rounds make allocations deterministic;
# timing stays unjudged because a shared CI runner is too noisy.

# A broken budget or an allocation regression fails the pull request's check run.
pr_check = "fail"

[functions]
min_percent_total = 0.5

# The producer hot path allocates a fresh chunk each time one fills: 24 B per
# push and 23.1 MB over the run. Any growth past that is a breach.
[[functions.budgets]]
match = "hotpath_drain::EventProducer::push"
alloc = { avg = "25 B", total = "24 MB" }
calls = { min = 1000000, max = 1000000 }
message = "push allocates more per event than a fresh chunk per fill"

[functions.alloc]
judged = true
# Deterministic, so any regression past the bar is real.
fail_check = true
min_percent_change = 2
metrics = ["avg", "total"]
min_calls = 0

[functions.timing]
fail_check = true
min_percent_change = 50
metrics = ["avg", "total"]
min_calls = 10
