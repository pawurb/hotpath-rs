# Shared policy for benchmarks without their own `hotpath/<benchmark>-policy.toml`.
# Pins the built-in default so a server-side default change does not shift judging.

[functions]
# `drain_into` bytes in `meta` follow the consumer buffer's peak doubling,
# which flips with thread scheduling between runs of one commit.
ignore = ["hotpath_drain::EventQueue::drain_into"]
min_percent_total = 0.5

[functions.alloc]
judged = true
min_percent_change = 2
metrics = ["avg", "total"]
min_calls = 0

[functions.timing]
judged = false
min_percent_change = 50
metrics = ["avg", "total"]
min_calls = 10

[server.alloc]
judged = true
min_percent_change = 2
metrics = ["avg", "total"]
min_calls = 0

[server.timing]
judged = true
min_percent_change = 50
metrics = ["avg", "total"]
min_calls = 0
