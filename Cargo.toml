[workspace]
members = [
    "crates/hotpath-macros",
    "crates/hotpath",
    "crates/test-tokio-async",
    "crates/test-smol-async",
    "crates/test-all-features",
    "crates/test-custom-feature",
    "crates/test-channels-asc",
    "crates/test-channels-crossbeam",
    "crates/test-channels-ftc",
    "crates/test-channels-flume",
    "crates/test-channels-std",
    "crates/test-rw-lock-std",
    "crates/test-rw-lock-parking-lot",
    "crates/test-rw-lock-async-lock",
    "crates/test-rw-lock-tokio",
    "crates/test-mutex-std",
    "crates/test-mutex-parking-lot",
    "crates/test-mutex-tokio",
    "crates/test-mutex-async-lock",
    "crates/test-streams",
    "crates/test-sqlx-08",
    "crates/test-sqlx-09",
    "crates/test-reqwest-012",
    "crates/test-reqwest-013",
    "crates/test-diesel",
    "crates/test-channels-tokio",
    "crates/test-futures",
    "crates/test-io",
    "crates/test-alloc",
    "crates/test-cpu",
    "crates/test-debug",
    "crates/hotpath-meta",
    "crates/hotpath-macros-meta",
]
resolver = "2"
# test-toasty is a standalone crate, not a workspace member: toasty's sqlite
# driver (rusqlite -> libsqlite3-sys 0.37) and the workspace's sqlx-sqlite
# (libsqlite3-sys 0.30) both `links = "sqlite3"`, which cargo forbids in a
# single resolution graph. Build it via --manifest-path.
exclude = ["crates/test-toasty"]

[workspace.dependencies]
hotpath-macros = { path = "./crates/hotpath-macros", version = "0.23.1" }
hotpath = { path = "./crates/hotpath", version = "0.23.1" }
hotpath-meta = { path = "./crates/hotpath-meta", version = "0.23.1" }
hotpath-macros-meta = { path = "./crates/hotpath-macros-meta", version = "0.23.1" }
proc-macro2 = "1.0.75"
quote = "1.0.35"
syn = { version = "2.0.52", features = ["full"] }

[profile.profiling]
inherits = "release"
debug = true
