global:
  scrape_interval: 5s

scrape_configs:
  - job_name: hotpath-meta
    # Negotiate the protobuf scrape format and ingest the native histograms
    # (the exporter's high-resolution path)...
    scrape_native_histograms: true
    # ...while also keeping the classic bucket series, so both query shapes
    # work side by side in the demo.
    always_scrape_classic_histograms: true
    # Matches HOTPATH_META_PROMETHEUS_AUTH_TOKEN when the meta exporter runs
    # with one, so it stays protected even when bound beyond loopback.
    authorization:
      credentials: hotpath-demo
    static_configs:
      # The hotpath-meta Prometheus server runs on the host machine, reachable
      # from inside the container via host.docker.internal. On Docker Desktop
      # (macOS/Windows) the default loopback bind works; on native Linux
      # host.docker.internal resolves to the bridge gateway, which cannot reach
      # a loopback-only listener, so run the exporter with
      # HOTPATH_META_PROMETHEUS_HOST=0.0.0.0.
      - targets: ["host.docker.internal:6782"]
