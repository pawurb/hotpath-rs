global:
  scrape_interval: 5s

scrape_configs:
  - job_name: hotpath-meta
    # No native-histogram scraping: classic fallback buckets only.
    # Matches HOTPATH_META_PROMETHEUS_AUTH_TOKEN when the meta exporter sets one.
    authorization:
      credentials: hotpath-demo
    static_configs:
      # On native Linux the bridge gateway cannot reach a loopback-only listener:
      # run the exporter with HOTPATH_META_PROMETHEUS_HOST=0.0.0.0.
      - targets: ["host.docker.internal:6782"]
