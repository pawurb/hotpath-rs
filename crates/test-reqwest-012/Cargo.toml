[package]
name = "test-reqwest-012"
version = "0.0.0"
publish = false
edition = "2021"
description = "Tests for reqwest 0.12 HTTP request instrumentation via reqwest-middleware."

[dependencies]
hotpath = { workspace = true, features = ["reqwest-0-12"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tiny_http = "0.12"

[features]
hotpath = ["hotpath/hotpath"]
