name: Cloud random benchmark

on:
  push:
    branches: [main]
  pull_request:

# Synthetic benchmark for checking PR comment correctness: `benchmark_random`
# touches every instrumented resource type and on each run randomly makes every
# resource 3x slower (or not), so every comment carries a known mix of
# regressions and improvements. The draw is attached to the report as
# `user_metadata`. Uploaded to the separate `random` series; same shape as
# `cloud-meta-benchmark.yml`.
#
# Pushes upload in process with the job's OIDC token. Fork PRs get no
# `id-token: write`, so pull requests write the report to an artifact and
# `cloud-random-benchmark-relay.yml` uploads it.
jobs:
  upload:
    name: cloud random benchmark (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The uploader reports its own outcome: one `::notice::` / `::warning::`
      # / `::error::` annotation plus a step summary block, and with
      # `HOTPATH_UPLOAD_STRICT=1` a failed upload exits 1. The grep is a
      # second guard that also covers a silently missing upload line.
      - name: Run random benchmark and upload report
        env:
          HOTPATH_UPLOAD: "1"
          HOTPATH_UPLOAD_STRICT: "1"
          HOTPATH_BENCHMARK: random
          HOTPATH_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,profile=release
          HOTPATH_EXCLUDE_WRAPPER: "true"
          HOTPATH_OUTPUT_FORMAT: none
        run: |
          set -o pipefail
          cargo run -q --release -p test-axum --example benchmark_random \
            --features hotpath,hotpath-alloc,hotpath-cloud 2>&1 | tee run.log
          grep -q '^hotpath: uploaded report ' run.log

  report:
    name: cloud random benchmark (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run random benchmark and write report
        env:
          HOTPATH_BENCHMARK: random
          HOTPATH_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,profile=release
          HOTPATH_EXCLUDE_WRAPPER: "true"
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: random-report.json
        run: |
          cargo run -q --release -p test-axum --example benchmark_random \
            --features hotpath,hotpath-alloc,hotpath-cloud
          test -s random-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: random-report
          path: random-report.json
          retention-days: 1
          if-no-files-found: error
