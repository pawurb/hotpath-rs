name: Cloud drain benchmark

on:
  push:
    branches: [main]
  pull_request:

# Transport-layer benchmark: the `hotpath-drain` `throughput` example runs
# several producer threads against one consumer while `hotpath-meta` profiles
# the queue's own hot paths (`push`, `sweep`, `drain_into`). Same shape as
# `cloud-meta-benchmark.yml`, uploaded to the separate `drain` series.
jobs:
  benchmark:
    name: cloud drain benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run drain benchmark and upload report
        env:
          HOTPATH_META_UPLOAD: fail-on-regression
          HOTPATH_META_BENCHMARK: drain
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,profile=release
          HOTPATH_META_EXCLUDE_WRAPPER: "true"
          HOTPATH_META_OUTPUT_FORMAT: none
        run: |
          set -o pipefail
          cargo run -q --release -p hotpath-drain --example throughput \
            --features hotpath-meta,hotpath-alloc-meta,hotpath-cloud-meta 2>&1 | tee run.log
          grep -q '^hotpath-meta: uploaded report ' run.log
