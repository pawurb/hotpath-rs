name: hotpath relay

# Uploads a hotpath report produced by a pull request job. Fork pull requests
# get no `id-token: write`, so the benchmark job saves the JSON report as an
# artifact and this workflow uploads it without checking out any PR code.
#
# Call it from a workflow of your own:
#
#   name: hotpath relay
#   on:
#     workflow_run:
#       workflows: ["<name of your benchmark workflow>"]
#       types: [completed]
#   jobs:
#     relay:
#       uses: pawurb/hotpath-rs/.github/workflows/hotpath-relay.yml@main
#       permissions:
#         actions: read
#         contents: read
#         id-token: write
#       with:
#         benchmark: my_benchmark
#         artifact_name: hotpath-report
#         report_file: report.json
#
# The benchmark job checks out `github.event.pull_request.head.sha`, runs the
# benchmark with the `hotpath-cloud` feature, `HOTPATH_OUTPUT_FORMAT=json`,
# `HOTPATH_OUTPUT_PATH=<report_file>` and `HOTPATH_BENCHMARK=<benchmark>`, and
# uploads the file as `<artifact_name>`.
#
# `workflow_run` only runs the calling workflow from the default branch, and
# `workflows:` matches by name, so renaming the benchmark workflow silently
# stops the relay.

on:
  workflow_call:
    inputs:
      benchmark:
        description: Benchmark series to upload to, 1-64 chars from [A-Za-z0-9._-].
        required: true
        type: string
      artifact_name:
        description: Name of the artifact the benchmark job uploaded.
        default: hotpath-report
        type: string
      report_file:
        description: Name of the JSON report inside that artifact.
        default: report.json
        type: string
      source_root:
        description: >-
          Build workspace root relative to the repository root, "" when they are
          the same. Prefixes relative paths in source links.
        default: ""
        type: string
      upload_url:
        description: Base URL of the hotpath server.
        default: https://hotpath.rs
        type: string
      fail_on_regression:
        description: >-
          Fail the job when the server's verdict on the report is a regression
          or a broken budget. A report nothing could be judged on never fails.
        default: false
        type: boolean

jobs:
  relay:
    name: relay ${{ inputs.benchmark }} benchmark
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The caller must grant these; a called workflow cannot raise them.
    permissions:
      actions: read # download the artifact from the benchmark run
      contents: read
      id-token: write # mint the token the server authenticates
    concurrency:
      # `workflow_run.pull_requests` is empty for fork pull requests, so the fork
      # branch identifies the run instead of the pull request number.
      group: hotpath-relay-${{ inputs.benchmark }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    env:
      # Inputs reach the scripts through the environment, never interpolated
      # into the script text.
      BENCHMARK: ${{ inputs.benchmark }}
      REPORT_PATH: artifact/${{ inputs.report_file }}
      SOURCE_ROOT: ${{ inputs.source_root }}
      UPLOAD_URL: ${{ inputs.upload_url }}
    steps:
      # If this cannot find the artifact, the usual cause is a renamed benchmark
      # workflow or a mismatched artifact_name.
      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare the report
        run: |
          set -euo pipefail
          # The event is stamped, not trusted: this job's token is a
          # `workflow_run` one, which the server accepts only for a
          # `pull_request` report. The assignments replace two keys and keep
          # every other key of `meta`, `policy` included.
          jq --arg source_root "$SOURCE_ROOT" \
            '.meta.source_root = $source_root | .meta.ci.event = "pull_request"' \
            "$REPORT_PATH" > upload.json

      # The server's answer is shown whatever the status: in the step summary,
      # and verbatim in an `::error::` annotation when the upload was rejected.
      # On success a `comment.error` means the server could not post or update
      # the pull request comment.
      - name: Upload the report
        run: |
          set -euo pipefail
          # `ACTIONS_ID_TOKEN_REQUEST_URL` always carries an `api-version`
          # query, so the audience is appended with `&`.
          token=$(curl -sS --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hotpath.rs" | jq -r .value)
          if ! curl -sS -X POST \
            "$UPLOAD_URL/api/v1/reports?benchmark=$BENCHMARK" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @upload.json \
            -w '%{http_code}' -o response.json -D headers.txt > status.txt; then
            echo "::error::hotpath.rs unreachable at $UPLOAD_URL"
            exit 1
          fi
          status=$(cat status.txt)
          request_id=$(grep -i '^x-request-id:' headers.txt | tr -d '\r' | cut -d' ' -f2 || true)
          {
            echo "## hotpath.rs $BENCHMARK benchmark"
            echo "HTTP $status, request ${request_id:--}"
            echo '```'; jq . response.json 2>/dev/null || cat response.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 201 ] && [ "$status" != 200 ]; then
            echo "::error::hotpath.rs rejected the report (HTTP $status): $(cat response.json)"
            exit 1
          fi
          comment_error=$(jq -r '.comment.error // empty' response.json 2>/dev/null || true)
          if [ -n "$comment_error" ]; then
            echo "::warning::hotpath.rs comment failed: $comment_error"
          fi

      # The verdict is the one the pull request comment shows, judged under the
      # policy the report carried. A body without one is not a pass.
      - name: Fail on a regression
        if: inputs.fail_on_regression
        run: |
          set -euo pipefail
          if ! jq -e '.verdict.regressed == false' response.json > /dev/null; then
            summary=$(jq -r '"\(.verdict.regressions) regressions, \(.verdict.budgets_broken) budgets broken"' response.json 2>/dev/null || echo "no verdict in the response")
            echo "::error::hotpath.rs found a regression: $summary"
            exit 1
          fi
