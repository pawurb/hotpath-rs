name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: test ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hotpath
          POSTGRES_PASSWORD: hotpath
          POSTGRES_DB: hotpath
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U hotpath"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    strategy:
      fail-fast: false
      matrix:
        rust:
          - 1.89
          - stable
          - nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - name: Check no features
        run: |
          cargo check
      - name: Check all features
        if: matrix.rust != '1.89'
        run: |
          cargo check --all-features
      - name: Check hotpath crate with all features
        if: matrix.rust != '1.89'
        run: |
          cargo check -p hotpath --all-features
      - name: Check hotpath feature (time mode)
        run: |
          cargo check --features hotpath
      - name: Check hotpath tui
        run: |
          cargo check --bin hotpath --features tui
      - name: Check hotpath-alloc
        run: |
          cargo check --features "hotpath,hotpath-alloc"
      - name: Check hotpath-mcp
        run: |
          cargo check --features "hotpath,hotpath-mcp"
      - name: Check hotpath-prometheus feature
        run: |
          cargo check --features "hotpath,hotpath-prometheus"
      - name: Check hotpath-meta
        run: |
          cargo check --features "hotpath,hotpath-alloc-meta,hotpath-meta"
      - name: Run lib tests
        run: |
          cargo test --lib --features hotpath
      - name: Check TUI build
        run: |
          cargo check -p hotpath --bin hotpath --features=tui
      - name: Check meta TUI build
        run: |
          cargo check --features='tui,hotpath,hotpath-meta,hotpath-alloc-meta,hotpath-mcp,hotpath-mcp-meta,dev' --bin hotpath
      - name: Check utils build
        run: |
          cargo check -p hotpath --bin hotpath-utils --features=utils
      - name: Build tests
        run: |
          cargo build --tests
      - name: Compile tests (tui only)
        run: |
          cargo test -p hotpath --features tui --no-run
      - name: Compile tests (utils only)
        run: |
          cargo test -p hotpath --features utils --no-run
      - name: Run CLI tests
        run: |
          cargo test -p hotpath --bin hotpath --features=tui
      - name: Run guards tests
        run: |
          cargo test --features hotpath --test guards -- --nocapture --test-threads=1
      - name: Run functions_timing tests
        run: |
          cargo test --features hotpath --test functions_timing -- --nocapture --test-threads=1
      - name: Run functions_alloc tests
        run: |
          cargo test --features hotpath --test functions_alloc -- --nocapture --test-threads=1
      - name: Run locations tests
        run: |
          cargo test --features hotpath --test locations -- --nocapture --test-threads=1
      - name: Run cloud_histograms tests
        run: |
          cargo test --lib --features hotpath,hotpath-cloud
          cargo test --features hotpath --test cloud_histograms -- --nocapture --test-threads=1
          cargo test --features hotpath --test cloud_limit -- --nocapture --test-threads=1
      - name: Run all_noop example
        run: |
          cargo run --example all_noop
      - name: Run sample unit test
        run: |
          cargo test --example unit_test --features hotpath -- --nocapture --test-threads=1
      - name: Run noop example
        run: |
          cargo run --example basic_std
      - name: Run streams tests
        run: |
          cargo test --features hotpath --test streams -- --nocapture --test-threads=1
      - name: Run prometheus tests
        run: |
          cargo test --features hotpath,hotpath-prometheus --test prometheus_metrics -- --nocapture --test-threads=1
          cargo test --features hotpath,hotpath-prometheus --test prometheus_native -- --nocapture --test-threads=1
          cargo test --features hotpath,hotpath-prometheus --test prometheus_subsystems -- --nocapture --test-threads=1
          cargo test --features hotpath,hotpath-prometheus --test prometheus_flow -- --nocapture --test-threads=1
          cargo test --features hotpath,hotpath-prometheus --test prometheus_io -- --nocapture --test-threads=1
          cargo test --features hotpath,hotpath-prometheus --test prometheus_alloc -- --nocapture --test-threads=1
          cargo test --features hotpath,hotpath-prometheus --test prometheus_system -- --nocapture --test-threads=1
      - name: Run channels crossbeam tests
        run: |
          cargo test --features hotpath --test channels_crossbeam -- --nocapture --test-threads=1
      - name: Run channels crossbeam wrap tests
        run: |
          cargo test --features hotpath --test channels_crossbeam_wrap -- --nocapture --test-threads=1
      - name: Run channels std wrap tests
        run: |
          cargo test --features hotpath --test channels_std_wrap -- --nocapture --test-threads=1
      - name: Run channels tokio wrap tests
        run: |
          cargo test --features hotpath --test channels_tokio_wrap -- --nocapture --test-threads=1
      - name: Run channels futures tests
        run: |
          cargo test --features hotpath --test channels_ftc -- --nocapture --test-threads=1
      - name: Run channels async tests
        run: |
          cargo test --features hotpath --test channels_asc -- --nocapture --test-threads=1
      - name: Run channels std tests
        run: |
          cargo test --features hotpath --test channels_std -- --nocapture --test-threads=1
      - name: Run channels tokio tests
        run: |
          cargo test --features hotpath --test channels_tokio -- --nocapture --test-threads=1
      - name: Run channels flume tests
        run: |
          cargo test --features hotpath --test channels_flume -- --nocapture --test-threads=1
      - name: Run channels flume wrap tests
        run: |
          cargo test --features hotpath --test channels_flume_wrap -- --nocapture --test-threads=1
      - name: Run rwlocks std tests
        run: |
          cargo test --features hotpath --test rw_lock_std -- --nocapture --test-threads=1
      - name: Run rwlocks parking_lot tests
        run: |
          cargo test --features hotpath --test rw_lock_parking_lot -- --nocapture --test-threads=1
      - name: Run mutex std tests
        run: |
          cargo test --features hotpath --test mutex_std -- --nocapture --test-threads=1
      - name: Run mutex tokio tests
        run: |
          cargo test --features hotpath --test mutex_tokio -- --nocapture --test-threads=1
      - name: Run tokio runtime tests
        run: |
          cargo test --features hotpath --test tokio_runtime -- --nocapture --test-threads=1
      - name: Run threads tests
        run: |
          cargo test --features hotpath --test threads -- --nocapture --test-threads=1
      - name: Run futures tests
        run: |
          cargo test --features hotpath --test futures -- --nocapture --test-threads=1
      - name: Run io tests
        run: |
          cargo test --features hotpath --test io -- --nocapture --test-threads=1
      - name: Run io redis tests
        run: |
          cargo test --features hotpath --test io_redis -- --nocapture --test-threads=1
      - name: Run http reqwest tests
        run: |
          cargo test --features hotpath --test http_reqwest -- --nocapture --test-threads=1
      - name: Run http ureq tests
        run: |
          cargo test --features hotpath --test http_ureq -- --nocapture --test-threads=1
      - name: Run server axum tests
        run: |
          cargo test --features hotpath --test server_axum -- --nocapture --test-threads=1
      - name: Run sql sqlite tests
        # sqlx 0.9 (test-sqlx-09) has MSRV 1.94
        if: matrix.rust != '1.89'
        run: |
          cargo test --features hotpath --test sql_sqlite -- --nocapture --test-threads=1
      - name: Run sql postgres tests
        run: |
          cargo test --features hotpath --test sql_pg -- --nocapture --test-threads=1
      - name: Run diesel tests
        run: |
          cargo test --features hotpath --test diesel -- --nocapture --test-threads=1
      - name: Run diesel postgres tests
        run: |
          cargo test --features hotpath --test diesel_pg -- --nocapture --test-threads=1
      - name: Run toasty sqlite tests
        # toasty has MSRV 1.95
        if: matrix.rust != '1.89'
        run: |
          cargo test --features hotpath --test toasty_sqlite -- --nocapture --test-threads=1
      - name: Run toasty postgres tests
        if: matrix.rust != '1.89'
        run: |
          cargo test --features hotpath --test toasty_pg -- --nocapture --test-threads=1
      - name: Run debug tests
        run: |
          cargo test --features hotpath --test debug -- --nocapture --test-threads=1
      - name: Update dependencies
        run: |
          cargo update
      - name: Build all features (updated deps)
        if: matrix.rust != '1.89'
        run: |
          cargo build --all-features

  cpu-macos:
    name: cpu tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-cpu
      - name: Download samply binary from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.cargo/bin
          gh release download samply-macos-release -p samply -D ~/.cargo/bin --clobber --repo ${{ github.repository }}
          chmod +x ~/.cargo/bin/samply
          sudo chown root:wheel ~/.cargo/bin/samply
          sudo chmod u+s ~/.cargo/bin/samply
      - name: Build hotpath-samply wrapper
        run: |
          cargo build -p hotpath --bin hotpath-samply --features "hotpath,hotpath-cpu"
      - name: Run functions_cpu tests
        env:
          HOTPATH_SAMPLY_WRAPPER_BIN: ${{ github.workspace }}/target/debug/hotpath-samply
        run: |
          cargo test --features "hotpath,hotpath-cpu" --test functions_cpu -- --nocapture --test-threads=1

  cpu-linux:
    name: cpu tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cpu
      - name: Enable perf_event access
        run: |
          echo -1 | sudo tee /proc/sys/kernel/perf_event_paranoid
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
          echo 0 | sudo tee /proc/sys/kernel/kptr_restrict
      - name: Download samply binary from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.cargo/bin
          gh release download samply-release -p samply -D ~/.cargo/bin --clobber --repo ${{ github.repository }}
          chmod +x ~/.cargo/bin/samply
      - name: Build hotpath-samply wrapper
        run: |
          cargo build -p hotpath --bin hotpath-samply --features "hotpath,hotpath-cpu"
      - name: Run functions_cpu tests
        env:
          HOTPATH_SAMPLY_WRAPPER_BIN: ${{ github.workspace }}/target/debug/hotpath-samply
        run: |
          setsid -w cargo test --features "hotpath,hotpath-cpu" --test functions_cpu -- --nocapture --test-threads=1
      - name: Update dependencies
        run: |
          cargo update
      - name: Build hotpath-samply wrapper (updated deps)
        run: |
          cargo build -p hotpath --bin hotpath-samply --features "hotpath,hotpath-cpu"
