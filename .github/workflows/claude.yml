name: Claude

# Runs Claude Code on a pull request or issue when the repository owner
# mentions `@claude` in a comment or review. Mention-only by design: nothing
# runs on push or on PR open, and comments from anyone but the owner are
# ignored so the token cannot be spent by fork authors. `@claude review`
# reviews the pull request and posts inline findings.
#
# Authentication is `CLAUDE_CODE_OAUTH_TOKEN`, a repository secret created
# with `claude setup-token`, so runs draw on the account's Claude plan rather
# than API billing.
#
# Comment-triggered workflows always run the copy on the default branch, so
# this file does nothing until it is merged.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        github.event.review.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
